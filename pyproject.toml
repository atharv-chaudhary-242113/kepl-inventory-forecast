[project]
name = "inventory-forecast"
version = "0.1.0"
description = "A python-based pipeline that ingests POV, GRN, PV, and Closing Stock data to forecast monthly order quantity and tries to squeeze as much data as possible."
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastexcel>=0.20.2",
    "plotly>=6.8.0",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "pyside6>=6.11.1",
    "python-calamine>=0.7.0",
    "statsforecast>=2.0.3",
    "xlsxwriter>=3.2.9",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
]

[tool.pyrefly.errors]
redundant-cast = "warn"


[project.scripts]
inventory-forecast = "opstools.inventory_forecast.__main__:main"


[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pyrefly>=1.1.1",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/opstools"]


# ------- Ruff -------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"           # Standardized in docs/CODING_STANDARDS.md

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings everywhere, and assert is the whole point there.
"tests/**" = ["D", "S101", "ANN"]
# Thin __init__ files shouldn't fight the missing-docstring rule.
"src/opstools/**/__init__.py" = ["D104"]


[tool.ruff.format]
docstring-code-format = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"             # Short summary of all non-passing outcomes.

[tool.pyrefly]
search-path = ["src"]
python-version = "3.12.0"
preset = "strict"

exclude = [
    "./tests/",
]

ignore-missing-imports = [
    "statsforecast.*",
    "fastexcel.*",
    "plotly.*",
    "sklearn.*",
    "lightgbm.*",
]